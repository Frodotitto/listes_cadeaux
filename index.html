<script>
  const SUPABASE_URL = 'https://glufuwoyxbyljnnthmbq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdWZ1d295eGJ5bGpubnRobWJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTg4MjUsImV4cCI6MjE0NzI5NDgyNX0.Zi64NJ2qr07oZMCA8acwmD8f1fEP6NJN_DyO5IvrIUc';
  
  // Mots de passe
  const ACCESS_CODE_GUEST = '1234';  // Mot de passe Visiteur
  const ACCESS_CODE_ADMIN = '5678';  // Mot de passe Créateur

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let selectedRole = null; // 'guest' ou 'admin'
  let currentRole = null;  // Une fois authentifié
  let currentListId = null;
  let allLists = [];

  // 1. DÉMARRAGE ET SESSIONS
  window.addEventListener('DOMContentLoaded', () => {
    const savedRole = localStorage.getItem('user_role');
    const urlParams = new URLSearchParams(window.location.search);
    const hasAddUrl = urlParams.get('add_url');

    // Si on arrive via le raccourci iOS, on pré-sélectionne automatiquement le rôle Créateur
    if (hasAddUrl && savedRole !== 'admin') {
      selectRole('admin');
      return;
    }

    if (savedRole === 'guest' || savedRole === 'admin') {
      currentRole = savedRole;
      unlockSite();
    }
  });

  function selectRole(role) {
    selectedRole = role;
    document.getElementById('roleSelectionStep').classList.add('hidden');
    document.getElementById('passwordStep').classList.remove('hidden');
    document.getElementById('passInput').value = '';
    document.getElementById('authError').classList.add('hidden');

    if (role === 'guest') {
      document.getElementById('passwordTitle').innerText = "Accès Visiteur";
      document.getElementById('passwordSubtitle').innerText = "Entrez le mot de passe reçu pour consulter la liste.";
    } else {
      document.getElementById('passwordTitle').innerText = "Accès Créateur";
      document.getElementById('passwordSubtitle').innerText = "Entrez votre mot de passe créateur pour ajouter/gérer les articles.";
    }

    setTimeout(() => document.getElementById('passInput').focus(), 100);
  }

  function resetRoleSelection() {
    document.getElementById('roleSelectionStep').classList.remove('hidden');
    document.getElementById('passwordStep').classList.add('hidden');
  }

  function validatePassword() {
    const input = document.getElementById('passInput').value.trim();
    const expectedCode = selectedRole === 'guest' ? ACCESS_CODE_GUEST : ACCESS_CODE_ADMIN;

    if (input === expectedCode) {
      currentRole = selectedRole;
      localStorage.setItem('user_role', currentRole);
      unlockSite();
    } else {
      document.getElementById('authError').classList.remove('hidden');
    }
  }

  function unlockSite() {
    document.getElementById('authModal').classList.add('hidden');
    document.getElementById('appContent').classList.remove('opacity-10', 'pointer-events-none');
    
    const roleBadge = document.getElementById('roleBadge');
    if (currentRole === 'admin') {
      roleBadge.innerText = "Mode Créateur (Surprise préservée)";
      roleBadge.className = "text-indigo-600 text-sm font-bold";
      document.getElementById('adminSection').classList.remove('hidden');
    } else {
      roleBadge.innerText = "Espace Visiteur / Proches";
      roleBadge.className = "text-slate-500 text-sm";
      document.getElementById('adminSection').classList.add('hidden');
    }

    initApp();
  }

  function logout() {
    localStorage.removeItem('user_role');
    window.location.href = window.location.pathname; // Clean reload sans les paramètres d'URL
  }

  // 2. INITIALISATION ET RÉCEPTION DES LIENS (iOS / EXTENSION)
  async function initApp() {
    await loadLists();
    if (allLists.length > 0) selectList(allLists[0].id);

    const urlParams = new URLSearchParams(window.location.search);
    const addUrl = urlParams.get('add_url');

    if (addUrl) {
      if (currentRole !== 'admin') {
        alert("Avis : Seul le Créateur peut ajouter des articles à la liste.");
        return;
      }

      const decodedUrl = decodeURIComponent(addUrl);
      document.getElementById('productUrl').value = decodedUrl;

      const jsDataParam = urlParams.get('js_data');
      if (jsDataParam) {
        try {
          const parsed = JSON.parse(decodeURIComponent(jsDataParam));
          if (parsed.price) document.getElementById('productPrice').value = parsed.price;
          if (parsed.title) document.getElementById('productTitle').value = parsed.title;
        } catch(e) {}
      }

      const addPrice = urlParams.get('price');
      const addTitle = urlParams.get('title');

      if (addPrice && addPrice !== 'null' && addPrice.trim() !== '') {
        document.getElementById('productPrice').value = decodeURIComponent(addPrice).trim();
      }
      if (addTitle && addTitle !== 'null' && addTitle.trim() !== '') {
        document.getElementById('productTitle').value = decodeURIComponent(addTitle).trim();
      }

      try {
        document.getElementById('productStore').value = new URL(decodedUrl).hostname.replace('www.', '');
      } catch(e) {}

      if (document.getElementById('productTitle').value || document.getElementById('productPrice').value) {
        document.getElementById('fetchStatus').innerText = "✅ Infos extraites depuis Safari iOS !";
      } else {
        autoFillFromUrl();
      }
    }
  }

  // 3. CHARGEMENT ET ONGLETS
  async function loadLists() {
    const { data: lists } = await supabaseClient.from('lists').select('*').order('id', { ascending: true });
    allLists = lists || [];
    renderTabs();
    updateListDropdown();
  }

  function renderTabs() {
    const container = document.getElementById('tabsContainer');
    if (!container) return;
    container.innerHTML = '';
    allLists.forEach(list => {
      const isSelected = list.id === currentListId;
      const btn = document.createElement('button');
      btn.className = `px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 ${isSelected ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border hover:bg-slate-100'}`;
      btn.innerHTML = `<span>🎁 ${list.name}</span>${currentRole === 'admin' ? `<span onclick="deleteList(event, ${list.id})" class="hover:text-red-300">✕</span>` : ''}`;
      btn.onclick = () => selectList(list.id);
      container.appendChild(btn);
    });

    if (currentRole === 'admin') {
      const addBtn = document.createElement('button');
      addBtn.className = 'px-3 py-2 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 border border-emerald-300 hover:bg-emerald-200';
      addBtn.innerText = '➕ Nouvelle Liste';
      addBtn.onclick = createNewList;
      container.appendChild(addBtn);
    }
  }

  function selectList(id) { currentListId = id; renderTabs(); loadProducts(); }

  async function createNewList() {
    const name = prompt("Nom de la liste (ex: Naissance, Crémaillère) :");
    if (!name) return;
    const { data } = await supabaseClient.from('lists').insert([{ name }]).select();
    await loadLists();
    if (data && data[0]) selectList(data[0].id);
  }

  async function deleteList(e, id) {
    e.stopPropagation();
    if (!confirm("Supprimer cette liste et ses articles ?")) return;
    await supabaseClient.from('lists').delete().eq('id', id);
    await loadLists();
    if (allLists.length > 0) selectList(allLists[0].id);
    else { currentListId = null; loadProducts(); }
  }

  function updateListDropdown() {
    const select = document.getElementById('formListSelect');
    if (!select) return;
    select.innerHTML = '';
    allLists.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.id;
      opt.innerText = l.name;
      if (l.id === currentListId) opt.selected = true;
      select.appendChild(opt);
    });
  }

  // 4. EXTRACTION AVEC TIMEOUT DE SÉCURITÉ
  async function autoFillFromUrl() {
    const url = document.getElementById('productUrl').value.trim();
    const status = document.getElementById('fetchStatus');
    if (!url) return;

    status.innerText = "⏳ Récupération des infos...";
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    try {
      const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`, { signal: controller.signal });
      clearTimeout(timeoutId);
      const json = await res.json();

      if (json.status === 'success' && json.data) {
        const d = json.data;
        if (!document.getElementById('productTitle').value) document.getElementById('productTitle').value = d.title || '';
        if (!document.getElementById('productImage').value) document.getElementById('productImage').value = d.image ? d.image.url : '';
        if (!document.getElementById('productStore').value) document.getElementById('productStore').value = d.publisher || new URL(url).hostname.replace('www.', '');

        if (!document.getElementById('productPrice').value) {
          let priceFound = '';
          if (d.price && typeof d.price === 'object') priceFound = `${d.price.amount} €`;
          else if (d.description) {
            const match = d.description.match(/(\d+[\.,]\d{2})\s?€/);
            if (match) priceFound = match[0];
          }
          document.getElementById('productPrice').value = priceFound || 'Voir site';
        }
        status.innerText = "✅ Informations prêtes !";
      }
    } catch (err) {
      status.innerText = "⚠️ Détection automatique partielle. Complétez si besoin.";
    }
  }

  // 5. SAUVEGARDE PRODUIT (Créateur Uniquement)
  async function saveProduct() {
    if (currentRole !== 'admin') return alert("Action réservée au créateur.");

    const title = document.getElementById('productTitle').value;
    const url = document.getElementById('productUrl').value;
    const list_id = document.getElementById('formListSelect').value;

    if (!title || !url || !list_id) return alert("Champs obligatoires manquants.");

    const { data: existingProducts } = await supabaseClient
      .from('products')
      .select('id')
      .eq('list_id', list_id)
      .eq('url', url);

    if (existingProducts && existingProducts.length > 0) {
      return alert("⚠️ Cet article existe déjà dans cette liste !");
    }

    const { error } = await supabaseClient.from('products').insert([{
      title: title,
      url: url,
      image_url: document.getElementById('productImage').value || 'https://via.placeholder.com/300',
      store_name: document.getElementById('productStore').value || 'Boutique',
      price: document.getElementById('productPrice').value || 'Non renseigné',
      list_id: parseInt(list_id),
      is_bought: false
    }]);

    if (error) {
      alert("Erreur Supabase : " + error.message);
    } else {
      const fields = ['productUrl', 'productTitle', 'productPrice', 'productStore', 'productImage'];
      fields.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
      document.getElementById('fetchStatus').innerText = '';
      
      // Nettoyage de l'URL pour retirer add_url après ajout
      window.history.replaceState({}, document.title, window.location.pathname);
      selectList(parseInt(list_id));
    }
  }

  // 6. AFFICHAGE ET MASQUAGE DE LA SURPRISE
  async function loadProducts() {
    const listContainer = document.getElementById('productList');
    listContainer.innerHTML = '';
    if (!currentListId) return listContainer.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8">Aucune liste.</p>';

    const { data: products } = await supabaseClient.from('products').select('*').eq('list_id', currentListId).order('created_at', { ascending: false });
    if (!products || products.length === 0) return listContainer.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8 italic">Liste vide.</p>';

    products.forEach(product => {
      const isGuest = currentRole === 'guest';
      const showBoughtStatus = isGuest && product.is_bought;

      const card = document.createElement('div');
      card.className = `bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between ${showBoughtStatus ? 'opacity-60 bg-slate-100' : ''}`;
      card.innerHTML = `
        <div>
          <div class="h-48 overflow-hidden bg-slate-100 relative">
            <img src="${product.image_url}" alt="${product.title}" class="w-full h-full object-contain p-2">
            ${showBoughtStatus ? '<span class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded font-bold">🎁 Déjà offert</span>' : ''}
            ${currentRole === 'admin' ? `<button onclick="deleteProduct(${product.id})" class="absolute top-2 right-2 bg-slate-800 bg-opacity-70 text-white p-1.5 rounded-full hover:bg-red-600 transition text-xs">🗑️</button>` : ''}
          </div>
          <div class="p-4">
            <span class="text-xs font-semibold text-indigo-500 uppercase tracking-wider">${product.store_name}</span>
            <h3 class="font-bold text-slate-800 text-base line-clamp-2 mt-1">${product.title}</h3>
            <p class="text-lg font-extrabold text-slate-900 mt-2">${product.price}</p>
          </div>
        </div>
        <div class="p-4 border-t bg-slate-50 flex flex-col gap-2">
          <a href="${product.url}" target="_blank" class="text-center text-xs text-indigo-600 hover:underline">Voir l'article d'origine ↗</a>
          <a href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(product.title)}" target="_blank" class="text-center text-xs text-slate-500 hover:underline">🔍 Comparer les prix</a>
          ${currentRole === 'admin' ? `
            <div class="text-center text-xs text-indigo-600 bg-indigo-50 font-medium py-2 rounded-lg border border-indigo-100">
              🔒 Statut d'achat masqué pour garder la surprise !
            </div>
          ` : product.is_bought ? `
            <p class="text-center text-xs text-slate-500 italic py-1">Réservé par ${product.bought_by || 'un proche'}</p>
          ` : `
            <button onclick="markAsBought(${product.id})" class="w-full bg-emerald-600 text-white text-xs font-bold py-2 rounded hover:bg-emerald-700 transition">Offrir cet article</button>
          `}
        </div>
      `;
      listContainer.appendChild(card);
    });
  }

  async function markAsBought(id) {
    if (currentRole === 'admin') return alert("Le créateur ne peut pas réserver les articles de sa propre liste !");
    const name = prompt("Votre prénom pour réserver ce cadeau :");
    if (!name) return;
    await supabaseClient.from('products').update({ is_bought: true, bought_by: name }).eq('id', id);
    loadProducts();
  }

  async function deleteProduct(id) {
    if (currentRole !== 'admin') return;
    if (!confirm("Supprimer cet article ?")) return;
    await supabaseClient.from('products').delete().eq('id', id);
    loadProducts();
  }
</script>
