<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listes Cadeaux 🎁</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">

  <!-- Modal de connexion -->
  <div id="authModal" class="fixed inset-0 bg-slate-900 bg-opacity-80 flex items-center justify-center z-50 p-4">
    <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center relative z-10">
      <div id="roleSelectionStep">
        <h2 class="text-2xl font-extrabold mb-2 text-indigo-600">Listes Cadeaux 🎁</h2>
        <p class="text-xs text-slate-500 mb-6">Comment souhaitez-vous vous connecter ?</p>
        <div class="flex flex-col gap-3">
          <button type="button" onclick="selectRole('guest')" class="w-full bg-indigo-50 border-2 border-indigo-200 hover:bg-indigo-100 text-indigo-700 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2 cursor-pointer">
            <span>👥 Famille</span>
          </button>
          <button type="button" onclick="selectRole('admin')" class="w-full bg-slate-100 border-2 border-slate-200 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2 cursor-pointer">
            <span>✏️ Administrateur</span>
          </button>
        </div>
      </div>

      <div id="passwordStep" class="hidden">
        <button type="button" onclick="resetRoleSelection()" class="text-xs text-slate-400 hover:text-slate-600 mb-3 block mx-auto cursor-pointer">← Changer de mode</button>
        <h3 id="passwordTitle" class="text-lg font-bold mb-2 text-slate-800">Accès Restreint</h3>
        <p id="passwordSubtitle" class="text-xs text-slate-500 mb-4"></p>
        
        <!-- Boîte de saisie du mot de passe avec bouton œil -->
        <div class="relative mb-4">
          <input type="password" id="passInput" class="w-full p-2.5 pr-10 border rounded-xl text-center text-lg font-bold tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••" onkeydown="if(event.key === 'Enter') validatePassword()">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer" title="Afficher/Masquer le mot de passe">
            <span id="togglePasswordIcon">👁️</span>
          </button>
        </div>

        <button type="button" onclick="validatePassword()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition cursor-pointer">Valider</button>
        <p id="authError" class="text-red-500 text-xs mt-3 hidden">Code incorrect. Réessayez.</p>
      </div>
    </div>
  </div>

  <!-- Modal de création / édition d'une liste -->
  <div id="listModal" class="fixed inset-0 bg-slate-900 bg-opacity-80 flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full relative z-10">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 id="listModalTitle" class="text-lg font-bold text-slate-800">🎁 Nouvelle Liste</h3>
        <button type="button" onclick="closeListModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>

      <input type="hidden" id="editListId">
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Nom de la liste :</label>
        <input type="text" id="listNameInput" placeholder="ex: Noël, Anniversaire..." class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div class="mb-6 bg-slate-50 p-3 rounded-xl border">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="listHideStatusInput" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
          <div>
            <span class="block text-xs font-bold text-slate-700">Masquer le statut d'achat à l'administrateur</span>
            <span class="block text-[10px] text-slate-500">Garde la surprise pour vous. La Famille verra toujours les réservations pour éviter les doublons.</span>
          </div>
        </label>
      </div>

      <div class="flex gap-2 justify-end">
        <button type="button" onclick="closeListModal()" class="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-sm hover:bg-slate-300">Annuler</button>
        <button type="button" onclick="saveList()" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-lg text-sm hover:bg-indigo-700">💾 Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Modal de modification d'un article -->
  <div id="editModal" class="fixed inset-0 bg-slate-900 bg-opacity-80 flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-lg w-full relative z-10">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 class="text-lg font-bold text-slate-800">✏️ Modifier l'article</h3>
        <button type="button" onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>

      <input type="hidden" id="editProductId">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Titre :</label>
          <input type="text" id="editProductTitle" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Prix :</label>
          <input type="text" id="editProductPrice" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Marchand :</label>
          <input type="text" id="editProductStore" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Liste :</label>
          <select id="editProductListSelect" class="w-full p-2 border rounded-lg text-sm bg-white"></select>
        </div>
      </div>

      <div class="mb-3">
        <label class="block text-xs font-semibold text-slate-500 mb-1">URL de l'article :</label>
        <input type="url" id="editProductUrl" class="w-full p-2 border rounded-lg text-sm">
      </div>

      <div class="mb-3">
        <label class="block text-xs font-semibold text-slate-500 mb-1">URL de l'image :</label>
        <input type="url" id="editProductImage" class="w-full p-2 border rounded-lg text-sm">
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Commentaire :</label>
        <textarea id="editProductComment" rows="2" class="w-full p-2 border rounded-lg text-sm"></textarea>
      </div>

      <div class="flex gap-2 justify-end">
        <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-sm hover:bg-slate-300">Annuler</button>
        <button type="button" onclick="updateProduct()" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-lg text-sm hover:bg-indigo-700">💾 Enregistrer</button>
      </div>
    </div>
  </div>

  <main id="appContent" class="max-w-4xl mx-auto opacity-10 pointer-events-none transition-opacity duration-300">
    <header class="flex justify-between items-center mb-6 border-b pb-4" id="mainHeader">
      <div>
        <h1 class="text-3xl font-extrabold text-indigo-600">Listes Cadeaux 🎁</h1>
        <p class="text-slate-500 text-sm" id="roleBadge">Chargement...</p>
      </div>
      <button type="button" onclick="logout()" class="text-xs bg-slate-200 px-3 py-1.5 rounded-full hover:bg-slate-300 font-medium text-slate-700">🚪 Déconnexion</button>
    </header>

    <section id="adminSection" class="hidden bg-white p-6 rounded-xl shadow-sm border mb-8">
      <h2 class="text-lg font-bold mb-4 text-slate-700" id="formHeaderTitle">➕ Ajouter un article</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Liste destination :</label>
          <select id="formListSelect" class="w-full p-2 border rounded-lg text-sm bg-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">URL du produit :</label>
          <div class="flex gap-2">
            <input type="url" id="productUrl" placeholder="https://..." class="flex-1 p-2 border rounded-lg text-sm">
            <button type="button" onclick="autoFillFromUrl()" class="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-xs font-bold hover:bg-indigo-200">🔍 Détecter</button>
          </div>
        </div>
      </div>
      <p id="fetchStatus" class="text-xs text-indigo-600 mb-3 h-4"></p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <input type="text" id="productTitle" placeholder="Titre du produit" class="p-2 border rounded-lg text-sm">
        <input type="text" id="productPrice" placeholder="Prix (ex: 49.99 €)" class="p-2 border rounded-lg text-sm">
        <input type="text" id="productStore" placeholder="Marchand (ex: Fnac)" class="p-2 border rounded-lg text-sm">
        <input type="url" id="productImage" placeholder="URL de l'image" class="p-2 border rounded-lg text-sm">
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Commentaire / Remarques :</label>
        <textarea id="productComment" rows="2" placeholder="Ex: Prendre la couleur bleue en taille L" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>

      <button type="button" onclick="saveProduct()" class="w-full mt-2 bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-700 text-sm">💾 Enregistrer dans la liste</button>
    </section>

    <div id="tabsContainer" class="flex flex-wrap gap-2 mb-6 border-b pb-3"></div>
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="productList"></section>
  </main>

  <script>
    const SUPABASE_URL = "__SUPABASE_URL__";
    const SUPABASE_KEY = "__SUPABASE_KEY__";
    const ACCESS_CODE_GUEST = "__GUEST_PASSWORD__";
    const ACCESS_CODE_ADMIN = "__ADMIN_PASSWORD__";
    const QUICK_ADD_TOKEN = "__QUICK_ADD_TOKEN__";

    function getSecret(val) {
      if (!val) return "";
      const str = String(val).trim();
      return str.startsWith("__") ? "" : str;
    }

    const ACTUAL_URL = getSecret(SUPABASE_URL);
    const ACTUAL_KEY = getSecret(SUPABASE_KEY);
    const ACTUAL_GUEST_PASS = getSecret(ACCESS_CODE_GUEST);
    const ACTUAL_ADMIN_PASS = getSecret(ACCESS_CODE_ADMIN);
    const ACTUAL_QUICK_TOKEN = getSecret(QUICK_ADD_TOKEN);

    let supabaseClient = null;
    let selectedRole = null;
    let currentRole = null;
    let currentListId = null;
    let allLists = [];
    let currentProductsMap = {};
    let isQuickAdd = false;

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('roleSelectionStep')?.classList.add('hidden');
      document.getElementById('passwordStep')?.classList.remove('hidden');
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').type = 'password';
      document.getElementById('togglePasswordIcon').innerText = '👁️';
      document.getElementById('authError')?.classList.add('hidden');

      if (role === 'guest') {
        document.getElementById('passwordTitle').innerText = "Accès Famille";
        document.getElementById('passwordSubtitle').innerText = "Entrez le mot de passe reçu pour consulter les listes.";
      } else {
        document.getElementById('passwordTitle').innerText = "Accès Administrateur";
        document.getElementById('passwordSubtitle').innerText = "Entrez votre mot de passe administrateur pour gérer les articles.";
      }
      setTimeout(() => document.getElementById('passInput')?.focus(), 100);
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('passInput');
      const icon = document.getElementById('togglePasswordIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.innerText = '🙈';
      } else {
        passInput.type = 'password';
        icon.innerText = '👁️';
      }
    }

    function resetRoleSelection() {
      document.getElementById('roleSelectionStep')?.classList.remove('hidden');
      document.getElementById('passwordStep')?.classList.add('hidden');
    }

    function validatePassword() {
      const input = document.getElementById('passInput').value.trim();
      const expectedCode = selectedRole === 'guest' ? ACTUAL_GUEST_PASS : ACTUAL_ADMIN_PASS;

      if (expectedCode !== "" && input === expectedCode) {
        currentRole = selectedRole;
        localStorage.setItem('user_role', currentRole);
        if (isQuickAdd) unlockQuickAddMode();
        else unlockSite();
      } else {
        document.getElementById('authError')?.classList.remove('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('user_role');
      localStorage.removeItem('active_list_id');
      window.location.href = window.location.pathname;
    }

    function unlockQuickAddMode() {
      document.getElementById('authModal')?.classList.add('hidden');
      document.getElementById('appContent')?.classList.remove('opacity-10', 'pointer-events-none');
      document.getElementById('mainHeader')?.classList.add('hidden');
      document.getElementById('tabsContainer')?.classList.add('hidden');
      document.getElementById('productList')?.classList.add('hidden');
      document.getElementById('adminSection')?.classList.remove('hidden');
      document.getElementById('formHeaderTitle').innerText = "⚡ Ajout rapide iOS";
      initApp();
    }

    function unlockSite() {
      document.getElementById('authModal')?.classList.add('hidden');
      document.getElementById('appContent')?.classList.remove('opacity-10', 'pointer-events-none');
      
      const roleBadge = document.getElementById('roleBadge');
      if (currentRole === 'admin') {
        if (roleBadge) {
          roleBadge.innerText = "Mode Administrateur";
          roleBadge.className = "text-indigo-600 text-sm font-bold";
        }
        document.getElementById('adminSection')?.classList.remove('hidden');
      } else {
        if (roleBadge) {
          roleBadge.innerText = "Espace Famille";
          roleBadge.className = "text-slate-500 text-sm";
        }
        document.getElementById('adminSection')?.classList.add('hidden');
      }
      initApp();
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        if (typeof window.supabase !== 'undefined' && ACTUAL_URL && ACTUAL_KEY) {
          supabaseClient = window.supabase.createClient(ACTUAL_URL, ACTUAL_KEY);
        }
      } catch(e) {}

      const urlParams = new URLSearchParams(window.location.search);
      isQuickAdd = urlParams.get('quick_add') === 'true';
      const tokenParam = urlParams.get('token');

      if (isQuickAdd && tokenParam && ACTUAL_QUICK_TOKEN && tokenParam === ACTUAL_QUICK_TOKEN) {
        currentRole = 'admin';
        localStorage.setItem('user_role', 'admin');
        unlockQuickAddMode();
        return;
      }

      const savedRole = localStorage.getItem('user_role');
      if (isQuickAdd) {
        if (savedRole === 'admin') {
          currentRole = 'admin';
          unlockQuickAddMode();
        } else {
          selectRole('admin');
        }
        return;
      }

      if (savedRole === 'guest' || savedRole === 'admin') {
        currentRole = savedRole;
        unlockSite();
      }
    });

    async function initApp() {
      await loadLists();
    
      // Écouteur pour enregistrer immédiatement le changement de liste dans le formulaire web / iOS
      const formSelect = document.getElementById('formListSelect');
      if (formSelect) {
        formSelect.addEventListener('change', (e) => {
          const selectedId = parseInt(e.target.value);
          if (selectedId) {
            currentListId = selectedId;
            localStorage.setItem('active_list_id', selectedId);
          }
        });
      }
    
      const urlParams = new URLSearchParams(window.location.search);
      const addUrl = urlParams.get('add_url');
    
      if (addUrl) {
        let decodedUrl = decodeURIComponent(addUrl);
        if (!decodedUrl.startsWith('http://') && !decodedUrl.startsWith('https://')) {
          decodedUrl = 'https://' + decodedUrl.replace(/^(2f|%2f|\/)+/i, '');
        }
    
        document.getElementById('productUrl').value = decodedUrl;
    
        const jsDataParam = urlParams.get('js_data');
        if (jsDataParam) {
          try {
            const parsed = JSON.parse(decodeURIComponent(jsDataParam));
            if (parsed.price) document.getElementById('productPrice').value = parsed.price;
            if (parsed.title) document.getElementById('productTitle').value = parsed.title;
            if (parsed.image) document.getElementById('productImage').value = parsed.image;
            if (parsed.store) document.getElementById('productStore').value = parsed.store;
            if (parsed.comment) document.getElementById('productComment').value = parsed.comment;
    
            // Si une liste spécifique est transmise dans le payload, on la sélectionne et on la mémorise
            if (parsed.list_id) {
              currentListId = parseInt(parsed.list_id);
              localStorage.setItem('active_list_id', currentListId);
              updateListDropdown();
            }
          } catch(e) {}
        }
    
        // Pré-sélectionne la liste mémorisée dans le menu déroulant
        if (formSelect && currentListId) {
          formSelect.value = currentListId;
        }
    
        try {
          if (!document.getElementById('productStore').value) {
            document.getElementById('productStore').value = new URL(decodedUrl).hostname.replace('www.', '');
          }
        } catch(e) {}
    
        if (document.getElementById('productTitle').value || document.getElementById('productPrice').value) {
          document.getElementById('fetchStatus').innerText = "✅ Informations extraites de la page !";
        } else {
          autoFillFromUrl();
        }
      }
    }

    async function loadLists() {
      if (!supabaseClient) return;
      const { data: lists, error } = await supabaseClient.from('lists').select('*').order('id', { ascending: true });
      if (error) return;
      allLists = lists || [];

      const savedListId = parseInt(localStorage.getItem('active_list_id'));
      const listExists = allLists.some(l => l.id === savedListId);

      if (savedListId && listExists) {
        currentListId = savedListId;
      } else if (allLists.length > 0) {
        currentListId = allLists[0].id;
        localStorage.setItem('active_list_id', currentListId);
      }

      renderTabs();
      updateListDropdown();
      if (!isQuickAdd && currentListId) loadProducts();
    }

    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      if (!container) return;
      container.innerHTML = '';

      allLists.forEach(list => {
        const isSelected = list.id === currentListId;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 ${isSelected ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border hover:bg-slate-100'}`;
        
        let actionsHtml = '';
        if (currentRole === 'admin') {
          actionsHtml = `
            <span onclick="openEditListModal(event, ${list.id})" title="Paramètres de la liste" class="hover:text-amber-300 ml-1">✏️</span>
            <span onclick="deleteList(event, ${list.id})" title="Supprimer la liste" class="hover:text-red-300">✕</span>
          `;
        }

        btn.innerHTML = `<span>🎁 ${list.name}${currentRole === 'admin' && list.hide_status ? ' 🔒' : ''}</span>${actionsHtml}`;
        btn.onclick = () => selectList(list.id);
        container.appendChild(btn);
      });

      if (currentRole === 'admin') {
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'px-3 py-2 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 border border-emerald-300 hover:bg-emerald-200 cursor-pointer';
        addBtn.innerText = '➕ Nouvelle Liste';
        addBtn.onclick = () => openCreateListModal();
        container.appendChild(addBtn);
      }
    }

    function selectList(id) { 
      currentListId = id; 
      localStorage.setItem('active_list_id', id);
      renderTabs(); 
      updateListDropdown();
      if (!isQuickAdd) loadProducts(); 
    }

    function openCreateListModal() {
      document.getElementById('listModalTitle').innerText = "🎁 Nouvelle Liste";
      document.getElementById('editListId').value = "";
      document.getElementById('listNameInput').value = "";
      document.getElementById('listHideStatusInput').checked = true;
      document.getElementById('listModal').classList.remove('hidden');
    }

    function openEditListModal(e, id) {
      e.stopPropagation();
      const list = allLists.find(l => l.id === id);
      if (!list) return;

      document.getElementById('listModalTitle').innerText = "✏️ Paramètres de la Liste";
      document.getElementById('editListId').value = list.id;
      document.getElementById('listNameInput').value = list.name || "";
      document.getElementById('listHideStatusInput').checked = !!list.hide_status;
      document.getElementById('listModal').classList.remove('hidden');
    }

    function closeListModal() {
      document.getElementById('listModal').classList.add('hidden');
    }

    async function saveList() {
      if (!supabaseClient) return;
      const id = document.getElementById('editListId').value;
      const name = document.getElementById('listNameInput').value.trim();
      const hide_status = document.getElementById('listHideStatusInput').checked;

      if (!name) return alert("Le nom de la liste est obligatoire.");

      if (id) {
        const { error } = await supabaseClient
          .from('lists')
          .update({ name, hide_status })
          .eq('id', parseInt(id));

        if (error) return alert("Erreur lors de la mise à jour : " + error.message);
      } else {
        const { data, error } = await supabaseClient
          .from('lists')
          .insert([{ name, hide_status }])
          .select();

        if (error) return alert("Erreur création liste : " + error.message);
        if (data && data[0]) currentListId = data[0].id;
      }

      closeListModal();
      await loadLists();
    }

    async function deleteList(e, id) {
      if (!supabaseClient) return;
      e.stopPropagation();
      if (!confirm("Supprimer cette liste et tous ses articles ?")) return;
      await supabaseClient.from('lists').delete().eq('id', id);
      if (currentListId === id) {
        localStorage.removeItem('active_list_id');
        currentListId = null;
      }
      await loadLists();
    }

    function updateListDropdown() {
      const select = document.getElementById('formListSelect');
      const editSelect = document.getElementById('editProductListSelect');
      
      [select, editSelect].forEach(sel => {
        if (!sel) return;
        sel.innerHTML = '';
        if (allLists.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.innerText = '-- Aucune liste disponible --';
          sel.appendChild(opt);
          return;
        }
        allLists.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l.id;
          opt.innerText = l.name;
          if (l.id === currentListId) opt.selected = true;
          sel.appendChild(opt);
        });
      });
    }

    async function autoFillFromUrl() {
      const url = document.getElementById('productUrl').value.trim();
      const status = document.getElementById('fetchStatus');
      if (!url) return;

      status.innerText = "⏳ Récupération des infos...";
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`, { signal: controller.signal });
        clearTimeout(timeoutId);
        const json = await res.json();

        if (json.status === 'success' && json.data) {
          const d = json.data;
          if (!document.getElementById('productTitle').value) document.getElementById('productTitle').value = d.title || '';
          if (!document.getElementById('productImage').value) document.getElementById('productImage').value = d.image ? d.image.url : '';
          if (!document.getElementById('productStore').value) document.getElementById('productStore').value = d.publisher || new URL(url).hostname.replace('www.', '');

          if (!document.getElementById('productPrice').value) {
            let priceFound = '';
            if (d.price && typeof d.price === 'object') priceFound = `${d.price.amount} €`;
            else if (d.description) {
              const match = d.description.match(/(\d+[\.,]\d{2})\s?€/);
              if (match) priceFound = match[0];
            }
            document.getElementById('productPrice').value = priceFound || 'Voir site';
          }
          status.innerText = "✅ Informations prêtes !";
        }
      } catch (err) {
        status.innerText = "⚠️ Détection automatique partielle. Complétez si besoin.";
      }
    }

    async function saveProduct() {
      if (currentRole !== 'admin') return alert("Action réservée à l'administrateur.");
      if (!supabaseClient) return alert("Base de données non connectée.");

      const title = document.getElementById('productTitle').value;
      const url = document.getElementById('productUrl').value;
      const list_id = document.getElementById('formListSelect').value;

      if (!title || !url || !list_id) return alert("Champs obligatoires manquants.");

      const { data: existingProducts } = await supabaseClient
        .from('products')
        .select('id')
        .eq('list_id', list_id)
        .eq('url', url);

      if (existingProducts && existingProducts.length > 0) {
        return alert("⚠️ Cet article existe déjà dans cette liste !");
      }

      const { error } = await supabaseClient.from('products').insert([{
        title: title,
        url: url,
        image_url: document.getElementById('productImage').value || 'https://via.placeholder.com/300',
        store_name: document.getElementById('productStore').value || 'Boutique',
        price: document.getElementById('productPrice').value || 'Non renseigné',
        comment: document.getElementById('productComment').value || '',
        list_id: parseInt(list_id),
        is_bought: false
      }]);

      if (error) {
        alert("Erreur Supabase : " + error.message);
      } else {
        if (isQuickAdd) {
          alert("🎉 Article ajouté avec succès à la liste !");
          window.location.href = window.location.pathname;
        } else {
          const fields = ['productUrl', 'productTitle', 'productPrice', 'productStore', 'productImage', 'productComment'];
          fields.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
          document.getElementById('fetchStatus').innerText = '';
          window.history.replaceState({}, document.title, window.location.pathname);
          selectList(parseInt(list_id));
        }
      }
    }

    async function loadProducts() {
      const listContainer = document.getElementById('productList');
      if (!listContainer) return;
      listContainer.innerHTML = '';

      if (!currentListId || !supabaseClient) {
        listContainer.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8">Aucune liste sélectionnée.</p>';
        return;
      }

      const currentList = allLists.find(l => l.id === currentListId);
      const isListHiddenFromAdmin = currentList ? !!currentList.hide_status : false;

      const { data: products, error } = await supabaseClient.from('products').select('*').eq('list_id', currentListId).order('created_at', { ascending: false });
      
      if (error) return;

      currentProductsMap = {};
      if (!products || products.length === 0) {
        listContainer.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8 italic">Cette liste ne contient aucun article pour le moment.</p>';
        return;
      }

      products.forEach(product => {
        currentProductsMap[product.id] = product;
        const isGuest = currentRole === 'guest';
        
        const showBoughtToGuest = isGuest && product.is_bought;
        const showBoughtToAdmin = !isGuest && !isListHiddenFromAdmin && product.is_bought;

        const card = document.createElement('div');
        card.className = `bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between ${showBoughtToGuest ? 'opacity-60 bg-slate-100' : ''}`;
        card.innerHTML = `
          <div>
            <div class="h-48 overflow-hidden bg-slate-100 relative">
              <img src="${product.image_url}" alt="${product.title}" 
                   referrerpolicy="no-referrer"
                   onerror="this.onerror=null; this.src='https://images.weserv.nl/?url=' + encodeURIComponent('${product.image_url}');"
                   class="w-full h-full object-contain p-2">
              ${showBoughtToGuest ? `<span class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded font-bold">🎁 Déjà offert (${product.bought_by || 'par un membre de la famille'})</span>` : ''}
              ${showBoughtToAdmin ? `<span class="absolute top-2 left-2 bg-emerald-600 text-white text-xs px-2 py-1 rounded font-bold">✓ Réservé (${product.bought_by})</span>` : ''}
              ${currentRole === 'admin' ? `
                <div class="absolute top-2 right-2 flex gap-1">
                  <button type="button" onclick="openEditModal(${product.id})" class="bg-slate-800 bg-opacity-70 text-white p-1.5 rounded-full hover:bg-indigo-600 transition text-xs cursor-pointer">✏️</button>
                  <button type="button" onclick="deleteProduct(${product.id})" class="bg-slate-800 bg-opacity-70 text-white p-1.5 rounded-full hover:bg-red-600 transition text-xs cursor-pointer">🗑️</button>
                </div>
              ` : ''}
            </div>
            <div class="p-4">
              <span class="text-xs font-semibold text-indigo-500 uppercase tracking-wider">${product.store_name}</span>
              <h3 class="font-bold text-slate-800 text-base line-clamp-2 mt-1">${product.title}</h3>
              <p class="text-lg font-extrabold text-slate-900 mt-2">${product.price}</p>
              ${product.comment ? `<p class="mt-2 text-xs text-slate-600 bg-amber-50 border border-amber-200 p-2 rounded-lg italic">💬 ${product.comment}</p>` : ''}
            </div>
          </div>
          <div class="p-4 border-t bg-slate-50 flex flex-col gap-2">
            <a href="${product.url}" target="_blank" class="text-center text-xs text-indigo-600 hover:underline">Voir l'article d'origine ↗</a>
            <a href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(product.title)}" target="_blank" class="text-center text-xs text-slate-500 hover:underline">🔍 Comparer les prix</a>
            ${currentRole === 'admin' ? (
              isListHiddenFromAdmin ? `
                <div class="text-center text-xs text-indigo-600 bg-indigo-50 font-medium py-2 rounded-lg border border-indigo-100">
                  🔒 Statut d'achat masqué pour garder la surprise !
                </div>
              ` : product.is_bought ? `
                <div class="text-center text-xs text-emerald-700 bg-emerald-50 font-bold py-2 rounded-lg border border-emerald-200">
                  ✓ Réservé par ${product.bought_by || 'un proche'}
                </div>
              ` : `
                <div class="text-center text-xs text-slate-500 bg-slate-100 py-2 rounded-lg border">
                  Disponible
                </div>
              `
            ) : product.is_bought ? `
              <div class="text-center text-xs text-red-600 bg-red-50 font-bold py-2 rounded-lg border border-red-100">
                🎁 Déjà réservé par ${product.bought_by || 'un proche'}
              </div>
            ` : `
              <button type="button" onclick="markAsBought(${product.id})" class="w-full bg-emerald-600 text-white text-xs font-bold py-2 rounded hover:bg-emerald-700 transition cursor-pointer">Offrir cet article</button>
            `}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function openEditModal(id) {
      const product = currentProductsMap[id];
      if (!product) return;

      document.getElementById('editProductId').value = product.id;
      document.getElementById('editProductTitle').value = product.title || '';
      document.getElementById('editProductPrice').value = product.price || '';
      document.getElementById('editProductStore').value = product.store_name || '';
      document.getElementById('editProductUrl').value = product.url || '';
      document.getElementById('editProductImage').value = product.image_url || '';
      document.getElementById('editProductComment').value = product.comment || '';
      
      const select = document.getElementById('editProductListSelect');
      if (select) select.value = product.list_id;

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function updateProduct() {
      if (currentRole !== 'admin' || !supabaseClient) return;

      const id = document.getElementById('editProductId').value;
      const title = document.getElementById('editProductTitle').value.trim();
      const price = document.getElementById('editProductPrice').value.trim();
      const store_name = document.getElementById('editProductStore').value.trim();
      const url = document.getElementById('editProductUrl').value.trim();
      const image_url = document.getElementById('editProductImage').value.trim();
      const comment = document.getElementById('editProductComment').value.trim();
      const list_id = parseInt(document.getElementById('editProductListSelect').value);

      if (!title || !url || !list_id) return alert("Champs obligatoires manquants.");

      const { error } = await supabaseClient.from('products').update({
        title, price, store_name, url, image_url, comment, list_id
      }).eq('id', id);

      if (error) {
        alert("Erreur de mise à jour : " + error.message);
      } else {
        closeEditModal();
        if (list_id !== currentListId) selectList(list_id);
        else loadProducts();
      }
    }

    async function markAsBought(id) {
      if (currentRole === 'admin') return alert("L'administrateur ne peut pas réserver les articles de sa propre liste !");
      if (!supabaseClient) return;
      const name = prompt("Votre prénom pour réserver ce cadeau :");
      if (!name) return;
      await supabaseClient.from('products').update({ is_bought: true, bought_by: name }).eq('id', id);
      loadProducts();
    }

    async function deleteProduct(id) {
      if (currentRole !== 'admin' || !supabaseClient) return;
      if (!confirm("Supprimer cet article ?")) return;
      await supabaseClient.from('products').delete().eq('id', id);
      loadProducts();
    }
  </script>
</body>
</html>
