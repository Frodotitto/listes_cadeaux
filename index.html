<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Envies 🎁</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">

  <!-- Modal de mot de passe du site -->
  <div id="authModal" class="fixed inset-0 bg-slate-900 bg-opacity-80 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full text-center">
      <h2 class="text-xl font-bold mb-4">🔒 Accès Restreint</h2>
      <p class="text-xs text-slate-500 mb-4">Entrez le code d'accès pour consulter les listes.</p>
      <input 
        type="password" 
        id="passInput" 
        class="w-full p-2 border rounded-lg mb-4 text-center" 
        placeholder="Code d'accès"
        onkeyup="if(event.key === 'Enter') checkAccess()"
      >
      <button onclick="checkAccess()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">Entrer</button>
      <p id="authError" class="text-red-500 text-xs mt-2 hidden">Code incorrect</p>
    </div>
  </div>

  <main id="appContent" class="max-w-4xl mx-auto opacity-10 pointer-events-none transition-opacity duration-300">
    <header class="flex justify-between items-center mb-6 border-b pb-4">
      <div>
        <h1 class="text-3xl font-extrabold text-indigo-600">Mes Envies 🎁</h1>
        <p class="text-slate-500 text-sm">Listes de cadeaux multi-boutiques</p>
      </div>
      <button onclick="toggleAdmin()" id="adminToggleBtn" class="text-xs bg-slate-200 px-3 py-1.5 rounded-full hover:bg-slate-300 font-medium">
        Mode Créateur
      </button>
    </header>

    <!-- Formulaire d'ajout (Mode Créateur) -->
    <section id="adminSection" class="hidden bg-white p-6 rounded-xl shadow-sm border mb-8">
      <h2 class="text-lg font-bold mb-4 text-slate-700">➕ Ajouter un article</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Liste destination :</label>
          <select id="formListSelect" class="w-full p-2 border rounded-lg text-sm bg-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">URL du produit :</label>
          <div class="flex gap-2">
            <input type="url" id="productUrl" placeholder="https://..." class="flex-1 p-2 border rounded-lg text-sm">
            <button onclick="autoFillFromUrl()" class="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-xs font-bold hover:bg-indigo-200">🔍 Détecter</button>
          </div>
        </div>
      </div>
      <p id="fetchStatus" class="text-xs text-indigo-600 mb-3 h-4"></p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="productTitle" placeholder="Titre du produit" class="p-2 border rounded-lg text-sm">
        <input type="text" id="productPrice" placeholder="Prix (ex: 49.99 €)" class="p-2 border rounded-lg text-sm">
        <input type="text" id="productStore" placeholder="Marchand (ex: Fnac)" class="p-2 border rounded-lg text-sm">
        <input type="url" id="productImage" placeholder="URL de l'image" class="p-2 border rounded-lg text-sm">
      </div>

      <button onclick="saveProduct()" class="w-full mt-4 bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-700 text-sm">
        💾 Enregistrer dans la liste
      </button>
    </section>

    <!-- Onglets de listes -->
    <div id="tabsContainer" class="flex flex-wrap gap-2 mb-6 border-b pb-3"></div>

    <!-- Grille des cartes produits -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="productList"></section>
  </main>

  <script>
    const SUPABASE_URL = 'https://glufuwoyxbyljnnthmbq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdWZ1d295eGJ5bGpubnRobWJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTg4MjUsImV4cCI6MjEwNzI5NDgyNX0.Zi64NJ2qr07oZMCA8acwmD8f1fEP6NJN_DyO5IvrIUc';
    
    const ACCESS_CODE = '1234';  // Mot de passe visiteurs
    const ADMIN_CODE = '5678';   // Mot de passe Mode Créateur

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let isAdmin = false;
    let currentListId = null;
    let allLists = [];

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('site_access_granted') === 'true') {
        unlockSite();
      }
    });

    function checkAccess() {
      const input = document.getElementById('passInput').value;
      if (input === ACCESS_CODE) {
        localStorage.setItem('site_access_granted', 'true');
        unlockSite();
      } else {
        document.getElementById('authError').classList.remove('hidden');
      }
    }

    function unlockSite() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('appContent').classList.remove('opacity-10', 'pointer-events-none');
      initApp();
    }

    function toggleAdmin() {
      if (!isAdmin) {
        const pass = prompt("Entrez le mot de passe Créateur :");
        if (pass === ADMIN_CODE) {
          isAdmin = true;
        } else if (pass !== null) {
          alert("Mot de passe Créateur incorrect !");
          return;
        } else {
          return;
        }
      } else {
        isAdmin = false;
      }

      document.getElementById('adminSection').classList.toggle('hidden', !isAdmin);
      document.getElementById('adminToggleBtn').innerText = isAdmin ? "Quitter Mode Créateur" : "Mode Créateur";
      renderTabs();
      loadProducts();
    }

    // Au chargement du site
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('site_access_granted') === 'true') {
        unlockSite();
      }
    });
    
    async function initApp() {
      await loadLists();
      if (allLists.length > 0) selectList(allLists[0].id);
    
      // VÉRIFICATION DES PARAMÈTRES REÇUS
      const urlParams = new URLSearchParams(window.location.search);
      const addUrl = urlParams.get('add_url');
      const addPrice = urlParams.get('price');
    
      if (addUrl) {
        if (!isAdmin) {
          toggleAdmin(); // Active le mode créateur
        }
    
        if (isAdmin) {
          document.getElementById('productUrl').value = decodeURIComponent(addUrl);
          
          // Si le prix est fourni par le raccourci iOS, on l'utilise directement
          if (addPrice) {
            document.getElementById('productPrice').value = decodeURIComponent(addPrice) + ' €';
          }
    
          autoFillFromUrl(); // Remplit l'image et le titre via Microlink
        }
      }
    }

    async function loadLists() {
      const { data: lists } = await supabaseClient.from('lists').select('*').order('id', { ascending: true });
      allLists = lists || [];
      renderTabs();
      updateListDropdown();
    }

    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      if (!container) return;
      container.innerHTML = '';
      allLists.forEach(list => {
        const isSelected = list.id === currentListId;
        const btn = document.createElement('button');
        btn.className = `px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 ${isSelected ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border hover:bg-slate-100'}`;
        btn.innerHTML = `<span>🎁 ${list.name}</span>${isAdmin ? `<span onclick="deleteList(event, ${list.id})" class="hover:text-red-300">✕</span>` : ''}`;
        btn.onclick = () => selectList(list.id);
        container.appendChild(btn);
      });

      if (isAdmin) {
        const addBtn = document.createElement('button');
        addBtn.className = 'px-3 py-2 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 border border-emerald-300 hover:bg-emerald-200';
        addBtn.innerText = '➕ Nouvelle Liste';
        addBtn.onclick = createNewList;
        container.appendChild(addBtn);
      }
    }

    function selectList(id) { currentListId = id; renderTabs(); loadProducts(); }

    async function createNewList() {
      const name = prompt("Nom de la liste (ex: Naissance, Crémaillère) :");
      if (!name) return;
      const { data } = await supabaseClient.from('lists').insert([{ name }]).select();
      await loadLists();
      if (data && data[0]) selectList(data[0].id);
    }

    async function deleteList(e, id) {
      e.stopPropagation();
      if (!confirm("Supprimer cette liste et ses articles ?")) return;
      await supabaseClient.from('lists').delete().eq('id', id);
      await loadLists();
      if (allLists.length > 0) selectList(allLists[0].id);
      else { currentListId = null; loadProducts(); }
    }

    function updateListDropdown() {
      const select = document.getElementById('formListSelect');
      if (!select) return;
      select.innerHTML = '';
      allLists.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        opt.innerText = l.name;
        if (l.id === currentListId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    // EXTRACTION DU PRODUIT AVEC EXTRACTION AMÉLIORÉE DU PRIX
    async function autoFillFromUrl() {
      const url = document.getElementById('productUrl').value.trim();
      const status = document.getElementById('fetchStatus');
      if (!url) return;
      status.innerText = "⏳ Récupération...";
      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
        const json = await res.json();
        if (json.status === 'success') {
          const d = json.data;
          document.getElementById('productTitle').value = d.title || '';
          document.getElementById('productImage').value = d.image ? d.image.url : '';
          document.getElementById('productStore').value = d.publisher || new URL(url).hostname.replace('www.', '');
          
          let priceFound = '';

          // Recherche multi-sources dans la réponse Microlink
          if (d.price && typeof d.price === 'object') {
            priceFound = `${d.price.amount} €`;
          } else if (d.price) {
            priceFound = `${d.price} €`;
          } else if (d.description) {
            const match = d.description.match(/(\d+[\.,]\d{2})\s?€/);
            if (match) priceFound = match[0];
          }

          document.getElementById('productPrice').value = priceFound || 'Voir site';
          status.innerText = "✅ Informations extraites !";
        }
      } catch (err) { status.innerText = "❌ Saisie manuelle requise."; }
    }

    // SAUVEGARDE AVEC VÉRIFICATION ANTI-DOUBLON
    async function saveProduct() {
      const title = document.getElementById('productTitle').value;
      const url = document.getElementById('productUrl').value;
      const list_id = document.getElementById('formListSelect').value;

      if (!title || !url || !list_id) {
        alert("Champs obligatoires manquants.");
        return;
      }

      // 1. Vérification si l'URL existe déjà dans cette liste
      const { data: existingProducts, error: checkError } = await supabaseClient
        .from('products')
        .select('id')
        .eq('list_id', list_id)
        .eq('url', url);

      if (existingProducts && existingProducts.length > 0) {
        alert("⚠️ Cet article existe déjà dans cette liste !");
        return;
      }

      // 2. Insertion
      const { error } = await supabaseClient.from('products').insert([{
        title: title,
        url: url,
        image_url: document.getElementById('productImage').value || 'https://via.placeholder.com/300',
        store_name: document.getElementById('productStore').value || 'Boutique',
        price: document.getElementById('productPrice').value || 'Non renseigné',
        list_id: parseInt(list_id),
        is_bought: false
      }]);

      if (error) {
        alert("Erreur Supabase : " + error.message);
      } else {
        const fields = ['productUrl', 'productTitle', 'productPrice', 'productStore', 'productImage'];
        for (let i = 0; i < fields.length; i++) {
          const el = document.getElementById(fields[i]);
          if (el) el.value = '';
        }
        document.getElementById('fetchStatus').innerText = '';
        selectList(parseInt(list_id));
      }
    }

    async function loadProducts() {
      const listContainer = document.getElementById('productList');
      listContainer.innerHTML = '';
      if (!currentListId) return listContainer.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8">Aucune liste.</p>';

      const { data: products } = await supabaseClient.from('products').select('*').eq('list_id', currentListId).order('created_at', { ascending: false });
      if (!products || products.length === 0) return listContainer.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8 italic">Liste vide.</p>';

      products.forEach(product => {
        const showBoughtStatus = !isAdmin && product.is_bought;
        const card = document.createElement('div');
        card.className = `bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between ${showBoughtStatus ? 'opacity-60 bg-slate-100' : ''}`;
        card.innerHTML = `
          <div>
            <div class="h-48 overflow-hidden bg-slate-100 relative">
              <img src="${product.image_url}" alt="${product.title}" class="w-full h-full object-contain p-2">
              ${showBoughtStatus ? '<span class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded font-bold">🎁 Déjà offert</span>' : ''}
              ${isAdmin ? `<button onclick="deleteProduct(${product.id})" class="absolute top-2 right-2 bg-slate-800 bg-opacity-70 text-white p-1.5 rounded-full hover:bg-red-600 transition text-xs">🗑️</button>` : ''}
            </div>
            <div class="p-4">
              <span class="text-xs font-semibold text-indigo-500 uppercase tracking-wider">${product.store_name}</span>
              <h3 class="font-bold text-slate-800 text-base line-clamp-2 mt-1">${product.title}</h3>
              <p class="text-lg font-extrabold text-slate-900 mt-2">${product.price}</p>
            </div>
          </div>
          <div class="p-4 border-t bg-slate-50 flex flex-col gap-2">
            <a href="${product.url}" target="_blank" class="text-center text-xs text-indigo-600 hover:underline">Voir l'article d'origine ↗</a>
            <a href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(product.title)}" target="_blank" class="text-center text-xs text-slate-500 hover:underline">🔍 Comparer les prix</a>
            ${isAdmin ? `
              <p class="text-center text-xs text-indigo-500 font-medium py-1">👁️ Mode Créateur (Surprise gardée)</p>
            ` : product.is_bought ? `
              <p class="text-center text-xs text-slate-500 italic py-1">Réservé par ${product.bought_by || 'un proche'}</p>
            ` : `
              <button onclick="markAsBought(${product.id})" class="w-full bg-emerald-600 text-white text-xs font-bold py-2 rounded hover:bg-emerald-700 transition">Offrir cet article</button>
            `}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    async function markAsBought(id) {
      const name = prompt("Votre prénom pour réserver ce cadeau :");
      if (!name) return;
      await supabaseClient.from('products').update({ is_bought: true, bought_by: name }).eq('id', id);
      loadProducts();
    }

    async function deleteProduct(id) {
      if (!confirm("Supprimer cet article ?")) return;
      await supabaseClient.from('products').delete().eq('id', id);
      loadProducts();
    }
  </script>
</body>
</html>
