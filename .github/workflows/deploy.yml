name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Secrets into index.html
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          QUICK_ADD_TOKEN: ${{ secrets.QUICK_ADD_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");

            function hash(str) {
              return str ? crypto.createHash("sha256").update(str.trim()).digest("hex") : "";
            }

            let content = fs.readFileSync("index.html", "utf8");
            content = content.split("__SUPABASE_URL__").join(process.env.SUPABASE_URL || "");
            content = content.split("__SUPABASE_KEY__").join(process.env.SUPABASE_KEY || "");
            content = content.split("__GUEST_PASSWORD__").join(hash(process.env.GUEST_PASSWORD));
            content = content.split("__ADMIN_PASSWORD__").join(hash(process.env.ADMIN_PASSWORD));
            content = content.split("__QUICK_ADD_TOKEN__").join(hash(process.env.QUICK_ADD_TOKEN));
            fs.writeFileSync("index.html", content, "utf8");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
