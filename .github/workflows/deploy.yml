name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets into index.html
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          QUICK_ADD_TOKEN: ${{ secrets.QUICK_ADD_TOKEN }}
        run: |
          sed -i "s|__SUPABASE_URL__|$SUPABASE_URL|g" index.html
          sed -i "s|__SUPABASE_KEY__|$SUPABASE_KEY|g" index.html
          sed -i "s|__GUEST_PASSWORD__|$GUEST_PASSWORD|g" index.html
          sed -i "s|__ADMIN_PASSWORD__|$ADMIN_PASSWORD|g" index.html
          sed -i "s|__QUICK_ADD_TOKEN__|$QUICK_ADD_TOKEN|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
