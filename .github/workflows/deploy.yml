name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Secrets into index.html
        run: |
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("index.html", "utf8");
            content = content.replace("__SUPABASE_URL__", "${{ secrets.SUPABASE_URL }}");
            content = content.replace("__SUPABASE_KEY__", "${{ secrets.SUPABASE_KEY }}");
            content = content.replace("__GUEST_PASSWORD__", "${{ secrets.GUEST_PASSWORD }}");
            content = content.replace("__ADMIN_PASSWORD__", "${{ secrets.ADMIN_PASSWORD }}");
            content = content.replace("__QUICK_ADD_TOKEN__", "${{ secrets.QUICK_ADD_TOKEN }}");
            fs.writeFileSync("index.html", content, "utf8");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
